spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/moltpadel
spring.datasource.username=moltpadel_backend
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
moltpadel.preus.interior=30.00
moltpadel.preus.exterior=25.00
moltpadel.reserves.limit-soci=3
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=moltpadel.noreply@gmail.com
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true